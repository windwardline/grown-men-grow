# pnpm settings for the theme's dev toolchain.

# dtrace-provider is an optional native dependency pulled in beneath gscan.
# Its build is refused rather than run: nothing in theme validation needs it,
# and a native compile is the slowest and most fragile step in a CI install.
allowBuilds:
  dtrace-provider: false

# There are deliberately no `overrides` here. One existed briefly on
# 2026-09-09, forcing multer off gscan 6.4.2's exact 2.2.0 pin, and it was
# removed the same day when gscan 6.6.0 turned out to drop multer altogether.
# An override is a workaround for an upstream that has not moved yet; when the
# upstream moves, the override has to go, or it outlives its reason as a pin
# nobody remembers choosing. `scripts/verify-dependency-exemptions.mjs` is what
# makes that non-optional — it re-derives from the registry whether each
# exemption still has a premise, so this file cannot quietly keep a workaround
# the world has stopped needing.
#
# If one is ever needed again: it goes here, not in package.json's `pnpm`
# field. pnpm 11 stopped reading that field and ignores it with a warning, so
# an override written there is silently not applied — worse than absent,
# because the lockfile still resolves the vulnerable version while the
# repository looks fixed.
