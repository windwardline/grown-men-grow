# OSV-Scanner policy for the dependency-scan gate in
# .github/workflows/security.yml.
#
# This file sits at the repository root rather than beside the lockfile it
# governs. OSV-Scanner's default discovery reads osv-scanner.toml from the
# scanned file's own directory and does not walk up, which would place it at
# theme/osv-scanner.toml -- and scripts/package-ghost-theme.mjs packages every
# tracked file under theme/ into the distributed Ghost theme. A CI suppression
# file has no business inside a published theme, so the workflow passes
# --config to point here explicitly.
#
# An entry here suppresses a finding; it does not fix one. Every entry states
# why the risk is accepted and carries an expiry, because an accepted risk that
# cannot expire is an unreviewed one. When ignoreUntil passes, the gate fails
# again and the decision has to be made a second time on that day's facts.

# extract-zip 2.0.1 -- symlink targets are not validated during extraction, so
# a crafted archive can write outside the extraction directory.
# https://osv.dev/GHSA-jmr9-qjv8-65gv (CVE-2026-56876, High 8.6)
#
# There is nothing to upgrade to. extract-zip has published no version above
# 2.0.1, so every dependent resolves there no matter how its range is written.
# The scanner agrees: this finding is reported with no fixed version.
#
# The rest of this paragraph used to name gscan 6.4.2 as "the current release"
# and @tryghost/zip 3.5.6 as "its latest". Both had gone stale inside a month
# -- gscan was on 6.6.0 and @tryghost/zip on 3.5.12 -- while this file went on
# asserting them, which is the exact failure an accepted risk is prone to: the
# decision is reviewed on the day it is made and never again until it expires.
# Version numbers are deliberately not restated here now.
# scripts/verify-dependency-exemptions.mjs re-derives the premise from the
# registry on every run instead, and fails the build the day it stops holding.
#
# It is a devDependency and reaches no published surface. gscan validates the
# Ghost theme locally and in CI; the only archive it ever extracts is the zip
# this repository builds moments earlier from its own tracked theme files
# (scripts/package-ghost-theme.mjs). No untrusted archive enters that path.
# The theme zip uploaded to Ghost(Pro) contains theme files only -- gscan and
# its dependency tree are never shipped or executed by the publication.
#
# Reconsider before the expiry if any of these change: gscan begins extracting
# an archive from outside this repository, a patched extract-zip ships, or
# @tryghost/zip moves off it.
[[IgnoredVulns]]
id = "GHSA-jmr9-qjv8-65gv"
ignoreUntil = 2026-11-09
reason = "extract-zip has published no version above 2.0.1, so there is no patched release to move to. devDependency only: the sole extraction is GScan theme validation of a zip this repository builds from its own tracked files, so no attacker-controlled archive reaches it. The no-patch premise is re-derived from the registry by scripts/verify-dependency-exemptions.mjs rather than asserted here. Expires 2026-11-09 for re-decision."

# extract-zip 2.0.1 -- a second symlink-escape in the same package, found the
# same way and unpatched the same way. Containment is checked only against an
# entry's parent directory and never against the entry's own final path
# component, so an archive carrying a symlink and then a regular file under one
# name writes through the symlink to anywhere the process can reach.
# https://osv.dev/GHSA-7pqw-9j4j-h8q3 (High 8.1,
# CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:H)
#
# Accepted on the same single fact as GHSA-jmr9-qjv8-65gv above: extract-zip
# has published nothing above 2.0.1, so no dependent can resolve past it. The
# scanner reports this one as unfixable while it reported four multer
# advisories the same day as fixable, and those were fixed rather than
# accepted -- by upgrading gscan to a release that pins the patched multer,
# which is why no override survives in theme/pnpm-workspace.yaml.
#
# The exposure argument is the one that matters and it holds here too: the
# attacker must control the contents of the archive. gscan is a devDependency
# that never runs on the published site, and the only archive it extracts is
# the theme zip this repository builds moments earlier from its own tracked
# files. No archive from outside this repository enters that path.
#
# Deliberately expires on the same day as GHSA-jmr9-qjv8-65gv. Both are the
# same package, the same class of defect and the same acceptance argument, so
# they are one decision and should be re-made in one sitting on that day's
# facts. Splitting the dates would mean two chances to forget one.
[[IgnoredVulns]]
id = "GHSA-7pqw-9j4j-h8q3"
ignoreUntil = 2026-11-09
reason = "Second unpatched symlink-escape in extract-zip 2.0.1, accepted on the same fact as GHSA-jmr9-qjv8-65gv: extract-zip has published no version above 2.0.1, so there is no patched release to move to. devDependency only: the sole extraction is GScan theme validation of a zip this repository builds from its own tracked files, so no attacker-controlled archive reaches it. The no-patch premise is re-derived from the registry by scripts/verify-dependency-exemptions.mjs rather than asserted here. Expires 2026-11-09 alongside GHSA-jmr9-qjv8-65gv for one combined re-decision."
