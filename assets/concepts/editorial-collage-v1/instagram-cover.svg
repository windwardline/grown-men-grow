<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <filter id="feed-collage-paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="19"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer>
    </filter>
    <filter id="feed-collage-photo" x="-5%" y="-5%" width="110%" height="110%">
      <feColorMatrix type="saturate" values="0.88"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.04" intercept="0.01"/>
        <feFuncG type="linear" slope="1.02" intercept="0.01"/>
        <feFuncB type="linear" slope="0.98" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <pattern id="feed-collage-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#121416" opacity="0.22"/>
    </pattern>
    <clipPath id="feed-collage-torn-a">
      <polygon points="18,26 294,10 566,28 832,8 1080,30 1062,316 1078,584 1054,840 786,826 528,846 274,824 12,842 28,572 8,298"/>
    </clipPath>
    <clipPath id="feed-collage-torn-b">
      <polygon points="16,18 328,6 634,24 1018,10 1034,350 1014,690 1030,1018 720,1006 414,1024 12,1008 28,672 8,334"/>
    </clipPath>
  </defs>
  <rect width="1080" height="1350" fill="#F8F3EA"/>
  <rect x="42" y="42" width="996" height="1266" fill="none" stroke="#121416" stroke-opacity="0.32" stroke-width="2"/>
  <text x="56" y="98" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="800" letter-spacing="4.2">GROWN MEN GROW</text>
  <text x="1024" y="98" fill="#3A1518" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="end" letter-spacing="2.8">FIELD NOTE 01</text>
  <rect x="44" y="136" width="992" height="700" fill="#60735A" transform="rotate(-1 540 486)"/>
  <g clip-path="url(#feed-collage-torn-a)" transform="translate(0 118)">
    <image href="../../source/editorial/repairing-wooden-chair.png" x="10" y="0" width="1060" height="870" preserveAspectRatio="xMidYMid slice" filter="url(#feed-collage-photo)"/>
  </g>
  <g transform="rotate(-4 205 146)">
    <rect x="98" y="122" width="214" height="48" fill="#D9CBAF" opacity="0.76"/>
    <line x1="106" y1="129" x2="302" y2="126" stroke="#fff" stroke-opacity="0.38"/>
  </g>
  <text x="52" y="820" fill="none" stroke="#F8F3EA" stroke-width="3" stroke-opacity="0.76" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="250" font-weight="900">01</text>
  <g transform="rotate(-1.5 540 960)">
    <rect x="40" y="808" width="730" height="150" fill="#F8F3EA"/>
    <text x="62" y="926" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="122" font-weight="700" letter-spacing="-5">Strength</text>
  </g>
  <g transform="rotate(1.2 550 1080)">
    <rect x="158" y="948" width="876" height="148" fill="#3A1518"/>
    <text x="186" y="1065" fill="#F8F3EA" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="112" font-weight="900" letter-spacing="-4">HAS TO GROW UP</text>
  </g>
  <path d="M78 1132 C232 1100 414 1146 566 1114 C704 1086 852 1130 1002 1104" fill="none" stroke="#B14F3F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="62" y="1206" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="29" font-style="italic">A man can look strong and still be hiding.</text>
  <text x="62" y="1284" fill="#71706B" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2.5">GROWNMENGROW.COM</text>
  <text x="1016" y="1284" fill="#3A1518" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="end" letter-spacing="2.5">01 / 07</text>
  <rect width="1080" height="1350" filter="url(#feed-collage-paper)" opacity="0.22" pointer-events="none"/>
