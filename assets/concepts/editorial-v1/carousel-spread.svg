<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="spread-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.02"/>
      <stop offset="0.62" stop-color="#000" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </linearGradient>
    <filter id="spread-grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.14"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1080" height="1350" fill="#EEE6D8"/>
  <rect x="594" y="0" width="486" height="780" fill="#121416"/>
  <image href="essay-01-hero-source.png" x="594" y="0" width="486" height="780" preserveAspectRatio="xMaxYMid slice"/>
  <rect x="594" y="0" width="486" height="780" fill="#3A1518" opacity="0.1"/>
  <rect x="594" y="0" width="486" height="780" filter="url(#spread-grain)" opacity="0.22"/>
  <text x="58" y="72" fill="#3A1518" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="3.7">GROWN MEN GROW</text>
  <text x="58" y="145" fill="#71706B" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2.8">FIELD NOTE 01 · 03 / 07</text>
  <text x="54" y="370" fill="#9A493F" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="170">“</text>
  <text x="58" y="438" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="72" font-weight="700" text-anchor="start" letter-spacing="-2.4">Some of what</text><text x="58" y="514" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="72" font-weight="700" text-anchor="start" letter-spacing="-2.4">we called</text><text x="58" y="590" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="72" font-weight="700" text-anchor="start" letter-spacing="-2.4">strength</text>
  <rect x="58" y="690" width="180" height="9" fill="#3A1518"/>
  <text x="58" y="766" fill="#3A1518" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="64" font-weight="800" text-anchor="start" letter-spacing="-2.5">was fear with</text><text x="58" y="834" fill="#3A1518" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="64" font-weight="800" text-anchor="start" letter-spacing="-2.5">good posture.</text>
  <line x1="58" y1="1012" x2="1022" y2="1012" stroke="#121416" stroke-opacity="0.25"/>
  <text x="58" y="1075" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="3">BUT STRENGTH TELLS US WHAT A MAN CAN DO.</text>
  <text x="58" y="1134" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="30">It does not tell us what he serves.</text>
  <text x="58" y="1288" fill="#71706B" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2.4">GROWNMENGROW.COM</text>
  <text x="1022" y="1288" fill="#3A1518" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="end" letter-spacing="2.4">SWIPE →</text>
</svg>