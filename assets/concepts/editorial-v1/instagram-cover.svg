<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="feed-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.02"/>
      <stop offset="0.62" stop-color="#000" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </linearGradient>
    <filter id="feed-grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.14"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1080" height="1350" fill="#121416"/>
  <image href="essay-01-hero-source.png" x="0" y="0" width="1080" height="1350" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="1350" fill="url(#feed-shadow)"/>
  <rect width="1080" height="1350" filter="url(#feed-grain)" opacity="0.24"/>
  <rect x="0" y="0" width="1080" height="116" fill="#3A1518"/>
  <text x="54" y="73" fill="#EEE6D8" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="4.4">GROWN MEN GROW</text>
  <text x="1026" y="73" fill="#EEE6D8" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="end" letter-spacing="3">FIELD NOTE 01</text>
  <text x="58" y="310" fill="none" stroke="#EEE6D8" stroke-opacity="0.6" stroke-width="2" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="210" font-weight="800" letter-spacing="-8">01</text>
  <rect x="54" y="874" width="16" height="324" fill="#9A493F"/>
  <text x="104" y="948" fill="#EEE6D8" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="100" font-weight="800" text-anchor="start" letter-spacing="-3.5">Strength</text><text x="104" y="1040" fill="#EEE6D8" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="100" font-weight="800" text-anchor="start" letter-spacing="-3.5">Has to</text><text x="104" y="1132" fill="#EEE6D8" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="100" font-weight="800" text-anchor="start" letter-spacing="-3.5">Grow Up</text>
  <text x="104" y="1254" fill="#EEE6D8" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="27" font-style="italic">A man can look strong and still be hiding.</text>
  <text x="1026" y="1296" fill="#EEE6D8" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="end" letter-spacing="2.5">@GROWNMENGROW</text>
  <rect x="34" y="34" width="1012" height="1282" fill="none" stroke="#EEE6D8" stroke-opacity="0.24"/>
