<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="ghost-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.02"/>
      <stop offset="0.62" stop-color="#000" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </linearGradient>
    <filter id="ghost-grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.14"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#EEE6D8"/>
  <rect x="650" y="142" width="882" height="790" fill="#121416"/>
  <image href="essay-01-hero-source.png" x="650" y="142" width="882" height="790" preserveAspectRatio="xMaxYMid slice"/>
  <rect x="650" y="142" width="882" height="790" fill="#3A1518" opacity="0.08"/>
  <rect x="650" y="142" width="882" height="790" filter="url(#ghost-grain)" opacity="0.3"/>
  <rect x="606" y="142" width="44" height="790" fill="#3A1518"/>
  <line x1="68" y1="92" x2="1532" y2="92" stroke="#121416" stroke-width="2"/>
  <text x="68" y="68" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="4.2">GROWN MEN GROW</text>
  <text x="1532" y="68" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="end" letter-spacing="2.8">FIELD NOTE 01 · 2026</text>
  <text x="112" y="220" fill="#3A1518" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="3.4">ESSAY 01</text>
  <text x="68" y="330" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="102" font-weight="700" text-anchor="start" letter-spacing="-4">Strength</text><text x="68" y="426" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="102" font-weight="700" text-anchor="start" letter-spacing="-4">Has to</text><text x="68" y="522" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="102" font-weight="700" text-anchor="start" letter-spacing="-4">Grow Up</text>
  <line x1="70" y1="630" x2="180" y2="630" stroke="#9A493F" stroke-width="10"/>
  <text x="68" y="694" fill="#3A1518" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="30" font-weight="400" text-anchor="start" letter-spacing="-0.4">A man can look strong</text><text x="68" y="734" fill="#3A1518" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="30" font-weight="400" text-anchor="start" letter-spacing="-0.4">and still be hiding.</text>
  <text x="68" y="920" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2.1">MICHAEL PEACOCK</text>
  <text x="68" y="950" fill="#71706B" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.9">GROWNMENGROW.COM</text>
  <text x="630" y="910" fill="#EEE6D8" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.8" transform="rotate(-90 630 910)">THE UNFINISHED WORK OF BEING A MAN</text>
