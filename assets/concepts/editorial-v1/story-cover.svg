<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="story-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.02"/>
      <stop offset="0.62" stop-color="#000" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </linearGradient>
    <filter id="story-grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.14"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1080" height="1920" fill="#121416"/>
  <image href="essay-01-hero-source.png" x="0" y="0" width="1080" height="1920" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="1920" fill="url(#story-shadow)"/>
  <rect width="1080" height="1920" filter="url(#story-grain)" opacity="0.24"/>
  <rect x="0" y="1328" width="1080" height="592" fill="#3A1518" opacity="0.94"/>
  <text x="62" y="106" fill="#EEE6D8" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="4.5">GROWN MEN GROW</text>
  <text x="1018" y="106" fill="#EEE6D8" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="end" letter-spacing="3">ESSAY 01</text>
  <line x1="62" y1="142" x2="1018" y2="142" stroke="#EEE6D8" stroke-opacity="0.55"/>
  <text x="58" y="522" fill="none" stroke="#EEE6D8" stroke-opacity="0.5" stroke-width="2" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="300" font-weight="800">01</text>
  <text x="62" y="1458" fill="#EEE6D8" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="112" font-weight="800" text-anchor="start" letter-spacing="-4">Strength</text><text x="62" y="1560" fill="#EEE6D8" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="112" font-weight="800" text-anchor="start" letter-spacing="-4">Has to</text><text x="62" y="1662" fill="#EEE6D8" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="112" font-weight="800" text-anchor="start" letter-spacing="-4">Grow Up</text>
  <text x="62" y="1798" fill="#EEE6D8" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="29" font-style="italic">A man can look strong and still be hiding.</text>
  <text x="1018" y="1860" fill="#EEE6D8" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="end" letter-spacing="2.8">GROWNMENGROW.COM</text>
</svg>