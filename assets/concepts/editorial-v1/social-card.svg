  <text x="576" y="468" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="27" font-style="italic">A man can look strong and still be hiding.</text>
  <text x="576" y="574" fill="#71706B" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2.4">GROWNMENGROW.COM</text>
