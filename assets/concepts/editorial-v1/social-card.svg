  <rect x="0" y="0" width="512" height="630" fill="#3A1518" opacity="0.1"/>
  <rect x="0" y="0" width="512" height="630" filter="url(#social-grain)" opacity="0.22"/>
  <rect x="512" y="0" width="18" height="630" fill="#3A1518"/>
  <text x="576" y="72" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="3.8">GROWN MEN GROW</text>
  <text x="1140" y="72" fill="#71706B" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="end" letter-spacing="2.6">FIELD NOTE 01</text>
  <text x="576" y="230" fill="#3A1518" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="72" font-weight="700" text-anchor="start" letter-spacing="-2.8">Strength Has to</text><text x="576" y="304" fill="#3A1518" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="72" font-weight="700" text-anchor="start" letter-spacing="-2.8">Grow Up</text>
