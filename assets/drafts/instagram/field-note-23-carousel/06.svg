        <feFuncG type="linear" slope="1.02" intercept="0.01"/>
        <feFuncB type="linear" slope="0.99" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <pattern id="fn23-06-dots" width="12" height="12" patternUnits="userSpaceOnUse">
