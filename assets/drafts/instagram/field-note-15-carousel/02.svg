<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <filter id="fn15-02-paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer>
    </filter>
    <filter id="fn15-02-photo" x="-5%" y="-5%" width="110%" height="110%">
      <feColorMatrix type="saturate" values="0.9"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.03" intercept="0.01"/>
        <feFuncG type="linear" slope="1.02" intercept="0.01"/>
        <feFuncB type="linear" slope="0.99" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <pattern id="fn15-02-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.55" fill="#121416" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="#EEE6D8"/>
  <text x="58" y="94" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="4.1">GROWN MEN GROW</text>
  <text x="1022" y="94" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="end" letter-spacing="2.7">FIELD NOTE 15 · 02 / 07</text>
  <text x="74" y="330" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="72" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Every dimension carries</text><text x="74" y="422" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="72" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">a second number</text><text x="74" y="514" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="72" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">in smaller type.</text>
    <text x="76" y="660" fill="#3A1518" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="44" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0.2">Plus or minus five thousandths —</text><text x="76" y="720" fill="#3A1518" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="44" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0.2">the engineer admitting that nothing</text><text x="76" y="780" fill="#3A1518" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="44" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0.2">gets made exactly.</text>
    <g>
    <line x1="296" y1="940" x2="744.8" y2="940" stroke="#121416" stroke-width="3.84" opacity="0.55"/>
    <line x1="320" y1="980.8" x2="668" y2="980.8" stroke="#3A1518" stroke-width="8.4" stroke-linecap="round"/>
    <line x1="668" y1="967.5999999999999" x2="668" y2="994" stroke="#3A1518" stroke-width="4.08" opacity="0.72"/>
    <line x1="704" y1="940" x2="704" y2="980.8" stroke="#3A1518" stroke-width="4.08"/>
    <line x1="692" y1="940" x2="716" y2="940" stroke="#3A1518" stroke-width="4.08"/>
    <line x1="692" y1="980.8" x2="716" y2="980.8" stroke="#3A1518" stroke-width="4.08"/>
