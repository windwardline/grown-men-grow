<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <filter id="fn15-06-paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer>
    </filter>
    <filter id="fn15-06-photo" x="-5%" y="-5%" width="110%" height="110%">
      <feColorMatrix type="saturate" values="0.9"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.03" intercept="0.01"/>
        <feFuncG type="linear" slope="1.02" intercept="0.01"/>
        <feFuncB type="linear" slope="0.99" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <pattern id="fn15-06-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.55" fill="#121416" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="#EEE6D8"/>
  <text x="58" y="94" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="4.1">GROWN MEN GROW</text>
  <text x="1022" y="94" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="end" letter-spacing="2.7">FIELD NOTE 15 · 06 / 07</text>
  <g transform="rotate(-0.7 540 338)">
    <rect x="68" y="286" width="944" height="104" fill="#121416"/>
    <text x="92" y="365.04" fill="#F8F3EA" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="50" font-weight="900" letter-spacing="-0.4">FAULT IS AN INSPECTION.</text>
  </g>
    <text x="74" y="470" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="44" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">It looks backward, returns a verdict,</text><text x="74" y="530" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="44" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">and the moment it reads no defect</text><text x="74" y="590" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="44" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">found, the tool is finished.</text>
    <g transform="rotate(0.6 540 752)">
    <rect x="68" y="700" width="944" height="104" fill="#3A1518"/>
    <text x="92" y="779.04" fill="#F8F3EA" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="50" font-weight="900" letter-spacing="-0.4">RESPONSIBILITY IS A GAUGE.</text>
  </g>
    <text x="74" y="884" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="44" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">It never asks who did it. It reads the</text><text x="74" y="944" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="44" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">same number whether the answer is his</text><text x="74" y="1004" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="44" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">fault, someone else’s, or nobody’s.</text>
    <g>
