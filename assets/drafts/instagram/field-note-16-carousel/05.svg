    <text x="74" y="470" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="42" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">People know what to do with two weeks.</text><text x="74" y="528" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="42" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">Food in disposable pans, masking tape on</text><text x="74" y="586" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="42" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">the lid, 350 for forty minutes.</text>
    <g transform="rotate(0.6 540 752)">
    <rect x="68" y="700" width="944" height="104" fill="#3A1518"/>
    <text x="92" y="779.04" fill="#F8F3EA" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.4">THAT IS NOT THE SHORING.</text>
  </g>
    <text x="74" y="884" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="42" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">That is the demolition crew, and</text><text x="74" y="942" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="42" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">demolition always draws a crowd.</text>
