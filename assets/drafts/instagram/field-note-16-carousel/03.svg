<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <filter id="fn16-03-paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer>
    </filter>
    <filter id="fn16-03-photo" x="-5%" y="-5%" width="110%" height="110%">
      <feColorMatrix type="saturate" values="0.9"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.03" intercept="0.01"/>
        <feFuncG type="linear" slope="1.02" intercept="0.01"/>
        <feFuncB type="linear" slope="0.99" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <pattern id="fn16-03-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.55" fill="#121416" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="#F8F3EA"/>
  <text x="58" y="94" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="4.1">GROWN MEN GROW</text>
  <text x="1022" y="94" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="end" letter-spacing="2.7">FIELD NOTE 16 · 03 / 07</text>
  <text x="88" y="380" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="96" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">A temp wall</text><text x="88" y="498" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="96" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">is not support.</text>
    <text x="90" y="596" fill="#3A1518" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="84" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0">It is a transfer.</text>
    <text x="76" y="760" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="40" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">The weight has to keep going — down the</text><text x="76" y="816" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="40" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">studs, through the plate, onto a footing</text><text x="76" y="872" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="40" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">sitting in dirt.</text>
    <g><line x1="300" y1="976" x2="740" y2="976" stroke="#3A1518" stroke-width="8" stroke-linecap="round"/>
    <line x1="520" y1="976" x2="520" y2="1186" stroke="#3A1518" stroke-width="7" stroke-linecap="round"/>
