  <text x="90" y="540" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="82" font-weight="700" font-style="italic" text-anchor="start" letter-spacing="-1.6">That is the trap.</text><text x="90" y="640" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="82" font-weight="700" font-style="italic" text-anchor="start" letter-spacing="-1.6">The exhale feels</text><text x="90" y="740" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="82" font-weight="700" font-style="italic" text-anchor="start" letter-spacing="-1.6">like completion.</text>
