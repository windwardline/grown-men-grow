<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <filter id="fn4-02-paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer>
    </filter>
    <filter id="fn4-02-photo" x="-5%" y="-5%" width="110%" height="110%">
      <feColorMatrix type="saturate" values="0.9"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.03" intercept="0.01"/>
        <feFuncG type="linear" slope="1.02" intercept="0.01"/>
        <feFuncB type="linear" slope="0.99" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <pattern id="fn4-02-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.55" fill="#121416" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="#EEE6D8"/>
  <text x="58" y="94" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="4.1">GROWN MEN GROW</text>
  <text x="1022" y="94" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="end" letter-spacing="2.7">FIELD NOTE 04 · 02 / 07</text>
  <text x="72" y="320" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="88" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="-1.6">Say the hard thing,</text><text x="72" y="422" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="88" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="-1.6">feel the pressure drop.</text>
    <rect x="74" y="480" width="480" height="18" fill="#3A1518" transform="rotate(-0.6 314 489)"/>
    <text x="74" y="640" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="52" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="-1.6">The relief is real.</text><text x="74" y="710" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="52" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="-1.6">It arrives whether or not</text><text x="74" y="780" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="52" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="-1.6">anything else happens.</text>
    <rect x="74" y="880" width="220" height="16" fill="#60735A" transform="rotate(-1 184 888)"/>
  <text x="58" y="1292" fill="#71706B" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="2.5">@GROWNMENGROW</text>
  <rect width="1080" height="1350" filter="url(#fn4-02-paper)" opacity="0.22" pointer-events="none"/>
</svg>