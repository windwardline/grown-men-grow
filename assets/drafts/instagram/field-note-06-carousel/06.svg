    <text x="72" y="980" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="58" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="-1.6">The demotion: stop.</text><text x="72" y="1054" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="58" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="-1.6">Find the actual fire —</text><text x="72" y="1128" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="58" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="-1.6">it’s rarely where the</text><text x="72" y="1202" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="58" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="-1.6">smoke is thickest.</text>
    <text x="74" y="1270" fill="#3A1518" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="48" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="-1.6">Then decide. You, not it.</text>
  <text x="58" y="1292" fill="#71706B" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="2.5">@GROWNMENGROW</text>
