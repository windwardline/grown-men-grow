<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F2EBDD"/>
  <rect x="0" y="0" width="18" height="1350" fill="#3A1518"/><rect x="38" y="0" width="3" height="1350" fill="#3A1518" fill-opacity="0.34"/>
  <text x="90" y="92" fill="#3A1518" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2.6">GROWN MEN GROW</text>
  <text x="90" y="128" fill="#3A1518" fill-opacity="0.62" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2.1">FIELD NOTE 01</text>
  <text x="990" y="92" text-anchor="end" fill="#3A1518" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1.8">02 / 07</text>
  <text x="90" y="300" text-anchor="start" fill="#3A1518" font-family="Helvetica Neue, Arial, sans-serif" font-size="82" font-weight="800" font-style="normal" letter-spacing="-1.4"><tspan x="90" dy="0">Courage.</tspan><tspan x="90" dy="96">Discipline.</tspan><tspan x="90" dy="96">Competence.</tspan></text>
    <text x="90" y="710" text-anchor="start" fill="#3A1518" font-family="Georgia, Times New Roman, serif" font-size="54" font-weight="400" font-style="normal" letter-spacing="-1.4"><tspan x="90" dy="0">The ability to stay steady</tspan><tspan x="90" dy="76">when things get ugly.</tspan></text>
    <text x="90" y="990" text-anchor="start" fill="#3A1518" font-family="Helvetica Neue, Arial, sans-serif" font-size="67" font-weight="800" font-style="normal" letter-spacing="-1.4"><tspan x="90" dy="0">I want more of that,</tspan><tspan x="90" dy="82">not less.</tspan></text>
  <text x="990" y="1270" text-anchor="end" fill="#3A1518" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="1.5">@GROWNMENGROW</text>
