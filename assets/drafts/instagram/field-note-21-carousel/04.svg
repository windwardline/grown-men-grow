<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <filter id="fn21-04-paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer>
    </filter>
    <filter id="fn21-04-photo" x="-5%" y="-5%" width="110%" height="110%">
      <feColorMatrix type="saturate" values="0.9"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.03" intercept="0.01"/>
        <feFuncG type="linear" slope="1.02" intercept="0.01"/>
        <feFuncB type="linear" slope="0.99" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <pattern id="fn21-04-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.55" fill="#121416" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="#EEE6D8"/>
  <text x="58" y="94" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="4.1">GROWN MEN GROW</text>
  <text x="1022" y="94" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="end" letter-spacing="2.7">FIELD NOTE 21 · 04 / 07</text>
  <rect x="64" y="200" width="420" height="500" fill="url(#fn21-04-dots)"/>
    <text x="520" y="300" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="60" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">By forty-five,</text><text x="520" y="378" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="60" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">twenty years</text><text x="520" y="456" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="60" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">of turning</text><text x="520" y="534" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="60" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">the work.</text>
    <text x="74" y="810" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="36" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">The job he is good at. The friends who like</text><text x="74" y="862" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="36" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">what he already does. Three subjects at dinner.</text>
    <text x="74" y="1010" fill="#3A1518" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="48" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0">It is the trade’s own advice,</text><text x="74" y="1074" fill="#3A1518" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="48" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0">applied to a life.</text>
