    <text x="66" y="872" fill="#EEE6D8" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="48" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="-1.6">It takes hairline cracks and a</text><text x="66" y="938" fill="#EEE6D8" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="48" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="-1.6">lower ceiling, and you meet them</text><text x="66" y="1004" fill="#EEE6D8" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="48" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="-1.6">years later, under something</text><text x="66" y="1070" fill="#EEE6D8" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="48" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="-1.6">ordinary.</text>
