  <text x="90" y="380" fill="#F2EBDD" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="2.5">GROWN MEN GROW</text>
  <text x="90" y="650" text-anchor="start" fill="#F2EBDD" font-family="Helvetica Neue, Arial, sans-serif" font-size="103" font-weight="800" font-style="normal" letter-spacing="-1.4"><tspan x="90" dy="0">A man can</tspan><tspan x="90" dy="121">look strong</tspan><tspan x="90" dy="121">and still</tspan><tspan x="90" dy="121">be hiding.</tspan></text>
  <text x="90" y="1370" fill="#F2EBDD" font-family="Georgia, Times New Roman, serif" font-size="43" font-style="italic">Strength Has to Grow Up</text>
