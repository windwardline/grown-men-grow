<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <filter id="reel-cover-paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer>
    </filter>
    <filter id="reel-cover-photo" x="-5%" y="-5%" width="110%" height="110%">
      <feColorMatrix type="saturate" values="0.9"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.03" intercept="0.01"/>
        <feFuncG type="linear" slope="1.02" intercept="0.01"/>
        <feFuncB type="linear" slope="0.99" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <pattern id="reel-cover-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.55" fill="#121416" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1080" height="1920" fill="#EEE6D8"/>
  <text x="58" y="94" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="4.2">GROWN MEN GROW</text>
  <rect x="0" y="1180" width="1080" height="740" fill="#3A1518"/>
  <rect x="72" y="286" width="620" height="336" fill="url(#reel-cover-dots)"/>
  <text x="64" y="392" fill="none" stroke="#3A1518" stroke-opacity="0.15" stroke-width="4" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="400">“</text>
  <g transform="rotate(-1.1 419 818)">
    <rect x="56" y="742" width="726" height="152" fill="#F8F3EA"/>
    <text x="80" y="857.52" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="100" font-weight="900" letter-spacing="-2.5">A MAN CAN</text>
  </g>
  <g transform="rotate(0.9 608 983)">
    <rect x="180" y="910" width="856" height="146" fill="#121416"/>
    <text x="204" y="1020.96" fill="#F8F3EA" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="96" font-weight="900" letter-spacing="-2.5">LOOK STRONG</text>
  </g>
  <path d="M80 1110 C248 1074 414 1130 584 1090 C742 1054 876 1102 1006 1078" fill="none" stroke="#B14F3F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="rotate(-0.8 378 1343)">
    <rect x="58" y="1268" width="640" height="150" fill="#F8F3EA"/>
    <text x="82" y="1382" fill="#3A1518" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="100" font-weight="900" letter-spacing="-2.5">AND STILL</text>
  </g>
  <g transform="rotate(1.1 660 1514)">
    <rect x="300" y="1436" width="720" height="156" fill="#B14F3F"/>
    <text x="324" y="1554.56" fill="#F8F3EA" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="96" font-weight="900" letter-spacing="-2.5">BE HIDING.</text>
  </g>
  <text x="1016" y="1752" text-anchor="end" fill="#EEE6D8" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="3.4">THE UNFINISHED WORK</text>
  <text x="58" y="1868" fill="#71706B" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="2.6">@GROWNMENGROW</text>
  <rect width="1080" height="1920" filter="url(#reel-cover-paper)" opacity="0.22" pointer-events="none"/>
</svg>