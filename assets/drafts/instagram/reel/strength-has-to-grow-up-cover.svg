<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <filter id="reel-cover-paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer>
    </filter>
    <filter id="reel-cover-photo" x="-5%" y="-5%" width="110%" height="110%">
      <feColorMatrix type="saturate" values="0.9"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.03" intercept="0.01"/>
        <feFuncG type="linear" slope="1.02" intercept="0.01"/>
        <feFuncB type="linear" slope="0.99" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <pattern id="reel-cover-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.55" fill="#121416" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1080" height="1920" fill="#F8F3EA"/>
  <text x="58" y="94" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="4.2">GROWN MEN GROW</text>
  <g transform="rotate(-0.7 540 655)">
    <rect x="26" y="140" width="1028" height="1064" fill="#60735A"/>
    <rect x="34" y="126" width="1012" height="1058" fill="#F8F3EA"/>
    <image href="/assets/source/editorial/repairing-wooden-chair.png" x="38" y="130" width="1004" height="1050" preserveAspectRatio="xMidYMid slice" filter="url(#reel-cover-photo)"/>
  </g>
  <g transform="rotate(-4 216 135)">
    <rect x="108" y="112" width="216" height="46" fill="#D9CBAF" opacity="0.74"/>
    <line x1="116" y1="119" x2="314" y2="116" stroke="#fff" stroke-opacity="0.38"/>
  </g>
  <g transform="rotate(-1 458 1209)">
    <rect x="48" y="1138" width="820" height="142" fill="#F8F3EA"/>
    <text x="72" y="1245.92" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="105" font-weight="900" letter-spacing="-2.5">A MAN CAN</text>
  </g>
  <g transform="rotate(1 609 1348)">
    <rect x="188" y="1274" width="842" height="148" fill="#3A1518"/>
    <text x="212" y="1386.48" fill="#F8F3EA" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="100" font-weight="900" letter-spacing="-2.5">LOOK STRONG</text>
  </g>
  <g transform="rotate(-0.8 425 1485)">
    <rect x="48" y="1416" width="754" height="138" fill="#EEE6D8"/>
    <text x="72" y="1520.88" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="100" font-weight="900" letter-spacing="-2.5">AND STILL</text>
  </g>
  <g transform="rotate(1 691 1621)">
    <rect x="352" y="1548" width="678" height="146" fill="#B14F3F"/>
    <text x="376" y="1658.96" fill="#F8F3EA" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="900" letter-spacing="-2.5">BE HIDING.</text>
  </g>
  <path d="M80 1746 C248 1710 414 1766 584 1726 C742 1690 876 1738 1006 1714" fill="none" stroke="#3A1518" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="58" y="1868" fill="#71706B" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="2.6">@GROWNMENGROW</text>
  <rect width="1080" height="1920" filter="url(#reel-cover-paper)" opacity="0.22" pointer-events="none"/>
