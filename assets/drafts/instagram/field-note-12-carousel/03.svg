  <text x="88" y="500" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="66" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="-1.6">A capacity that only holds</text><text x="88" y="588" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="66" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="-1.6">when conditions are perfect</text>
    <text x="90" y="700" fill="#3A1518" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="66" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="-1.6">is not a capacity.</text>
