    <text x="82" y="1006" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="52" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">No incident. No date.</text><text x="82" y="1074" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="52" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Nothing to point at.</text>
    <text x="82" y="1148" fill="#3A1518" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="46" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0">Nothing to fix is not the same</text><text x="82" y="1210" fill="#3A1518" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="46" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0">as nothing being wrong.</text>
  <text x="58" y="1292" fill="#71706B" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="2.5">@GROWNMENGROW</text>
