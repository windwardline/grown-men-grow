  <rect x="636" y="234" width="380" height="448" fill="url(#fn19-06-dots)"/>
    <text x="74" y="336" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="64" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">The trade's test</text><text x="74" y="418" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="64" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">has no opinion</text><text x="74" y="500" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="64" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">about intention.</text>
    <text x="74" y="742" fill="#3A1518" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="62" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0">Is there a fixture</text><text x="74" y="822" fill="#3A1518" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="62" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0">on the end of it?</text>
    <text x="74" y="904" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="36" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">Not is one planned. Not could there be.</text>
    <text x="74" y="972" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="44" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Intention has no flow rate.</text>
