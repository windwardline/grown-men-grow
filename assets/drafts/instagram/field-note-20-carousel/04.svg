  <rect width="1080" height="1350" fill="#F8F3EA"/>
  <text x="58" y="94" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="4.1">GROWN MEN GROW</text>
  <text x="1022" y="94" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="end" letter-spacing="2.7">FIELD NOTE 20 · 04 / 07</text>
  <text x="74" y="322" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="76" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">A balanced door</text><text x="74" y="418" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="76" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">stays where it is.</text>
    <text x="76" y="500" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="44" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">Halfway up, with the opener</text><text x="76" y="560" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="44" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">disconnected. It does not fall</text><text x="76" y="620" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="44" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">and it does not rise.</text>
