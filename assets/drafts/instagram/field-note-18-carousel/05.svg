    <g><rect x="300" y="720" width="480" height="74" rx="37" fill="none" stroke="#121416" stroke-width="5" opacity="0.85"/><line x1="444" y1="727" x2="444" y2="787" stroke="#121416" stroke-width="4.2" opacity="0.75"/><line x1="636" y1="727" x2="636" y2="787" stroke="#121416" stroke-width="4.2" opacity="0.75"/><circle cx="599.52" cy="757" r="15" fill="#B14F3F"/></g>
