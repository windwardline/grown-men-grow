<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <filter id="fn18-06-paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer>
    </filter>
    <filter id="fn18-06-photo" x="-5%" y="-5%" width="110%" height="110%">
      <feColorMatrix type="saturate" values="0.9"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.03" intercept="0.01"/>
        <feFuncG type="linear" slope="1.02" intercept="0.01"/>
        <feFuncB type="linear" slope="0.99" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <pattern id="fn18-06-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.55" fill="#121416" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="#EEE6D8"/>
  <text x="58" y="94" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="4.1">GROWN MEN GROW</text>
  <text x="1022" y="94" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="end" letter-spacing="2.7">FIELD NOTE 18 · 06 / 07</text>
  <rect x="636" y="234" width="380" height="448" fill="url(#fn18-06-dots)"/>
    <text x="74" y="330" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="62" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Some men will run it,</text><text x="74" y="410" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="62" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">find the level true,</text><text x="74" y="490" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="62" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">and still be facing</text><text x="74" y="570" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="62" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">a crooked wall.</text>
    <text x="74" y="740" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="40" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">The instrument was never the problem.</text><text x="74" y="796" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="40" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">It was in the bag the whole time.</text>
    <text x="74" y="872" fill="#3A1518" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="44" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0.2">No test on any workbench catches that.</text>
    <g><rect x="300" y="1000" width="480" height="74" rx="37" fill="none" stroke="#121416" stroke-width="5" opacity="0.85"/><line x1="444" y1="1007" x2="444" y2="1067" stroke="#121416" stroke-width="4.2" opacity="0.75"/><line x1="636" y1="1007" x2="636" y2="1067" stroke="#121416" stroke-width="4.2" opacity="0.75"/><circle cx="540" cy="1037" r="15" fill="#60735A"/></g>
  <text x="58" y="1292" fill="#71706B" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="2.5">@GROWNMENGROW</text>
  <rect width="1080" height="1350" filter="url(#fn18-06-paper)" opacity="0.22" pointer-events="none"/>
</svg>