    <text x="76" y="1170" fill="#3A1518" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="34" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0.2">The second reading comes off the same vial.</text><text x="76" y="1218" fill="#3A1518" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="34" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0.2">That agreement is the defect, not a disproof.</text>
