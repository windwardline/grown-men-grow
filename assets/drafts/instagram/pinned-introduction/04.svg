<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F2EBDD"/>
  <rect x="32" y="32" width="1016" height="1286" rx="2" fill="none" stroke="#3A1518" stroke-opacity="0.18" stroke-width="2"/>
  <text x="90" y="112" fill="#3A1518" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="2.4">GROWN MEN GROW</text>
  <text x="990" y="112" text-anchor="end" fill="#3A1518" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="1.8">04 / 07</text>
  <line x1="90" y1="154" x2="990" y2="154" stroke="#3A1518" stroke-opacity="0.38" stroke-width="2"/>
  <text x="90" y="330" fill="#3A1518" font-family="Helvetica Neue, Arial, sans-serif" font-size="104" font-weight="800" font-style="normal" letter-spacing="-1.4"><tspan x="90" dy="0">I still believe</tspan><tspan x="90" dy="120">in strength.</tspan></text>
    <text x="90" y="735" fill="#3A1518" font-family="Georgia, Times New Roman, serif" font-size="65" font-weight="400" font-style="normal" letter-spacing="-1.4"><tspan x="90" dy="0">I just no longer think</tspan><tspan x="90" dy="91">looking strong tells us</tspan><tspan x="90" dy="91">much about a man.</tspan></text>
  <circle cx="90" cy="1252" r="7" fill="#3A1518"/>
  <text x="114" y="1261" fill="#3A1518" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="1.5">@GROWNMENGROW</text>
