  <text x="90" y="540" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="80" font-weight="700" font-style="italic" text-anchor="start" letter-spacing="-1.6">We let the window close.</text><text x="90" y="638" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="80" font-weight="700" font-style="italic" text-anchor="start" letter-spacing="-1.6">Then we pay</text><text x="90" y="736" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="80" font-weight="700" font-style="italic" text-anchor="start" letter-spacing="-1.6">the crisis rate.</text>
