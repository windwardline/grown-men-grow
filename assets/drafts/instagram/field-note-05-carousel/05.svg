  <text x="88" y="400" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="88" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="-1.6">Knowing when to ask</text><text x="88" y="502" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="88" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="-1.6">is part of the skill.</text>
    <text x="90" y="680" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="50" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="-1.6">The electrician calls the inspector.</text><text x="90" y="750" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="50" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="-1.6">The pilot calls the tower.</text><text x="90" y="820" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="50" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="-1.6">That call is what good looks like.</text>
