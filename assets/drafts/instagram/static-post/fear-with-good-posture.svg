    <text x="74" y="1025.28" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="92" font-weight="900" letter-spacing="-2.5">WAS FEAR</text>
  </g>
  <g transform="rotate(1 659 1119)">
