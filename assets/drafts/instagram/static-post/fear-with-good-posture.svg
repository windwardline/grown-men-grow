    <text x="198" y="901.36" fill="#F8F3EA" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="-2.5">WE CALLED STRENGTH</text>
  </g>
