<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <filter id="static-post-paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer>
    </filter>
    <filter id="static-post-photo" x="-5%" y="-5%" width="110%" height="110%">
      <feColorMatrix type="saturate" values="0.9"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.03" intercept="0.01"/>
        <feFuncG type="linear" slope="1.02" intercept="0.01"/>
        <feFuncB type="linear" slope="0.99" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <pattern id="static-post-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.55" fill="#121416" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="#F8F3EA"/>
  <text x="58" y="94" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="4.1">GROWN MEN GROW</text>
  <text x="1022" y="94" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="end" letter-spacing="2.7">FIELD NOTE 01 · 01 / 01</text>
  <g transform="rotate(-0.8 540 430)">
    <rect x="26" y="150" width="1028" height="594" fill="#60735A"/>
    <rect x="34" y="136" width="1012" height="588" fill="#F8F3EA"/>
    <image href="/assets/source/editorial/sunlit-writing-table.png" x="38" y="140" width="1004" height="580" preserveAspectRatio="xMidYMid slice" filter="url(#static-post-photo)"/>
  </g>
  <g transform="rotate(4 880 145)">
    <rect x="790" y="122" width="180" height="46" fill="#D9CBAF" opacity="0.74"/>
    <line x1="798" y1="129" x2="960" y2="126" stroke="#fff" stroke-opacity="0.38"/>
  </g>
  <g transform="rotate(-1 476 740)">
