    <text x="70" y="773.28" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="92" font-weight="900" letter-spacing="-2.5">SOME OF WHAT</text>
  </g>
  <g transform="rotate(1 601 866)">
