    <text x="72" y="960" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="52" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="-1.6">The power drops, the switch throws,</text><text x="72" y="1030" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="52" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="-1.6">the load lands somewhere else.</text>
