  <text x="1022" y="94" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="end" letter-spacing="2.7">FIELD NOTE 17 · 06 / 07</text>
  <rect x="640" y="236" width="376" height="452" fill="url(#fn17-06-dots)"/>
    <text x="74" y="336" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="72" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">The rotten-egg smell</text><text x="74" y="428" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="72" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">is the protection</text><text x="74" y="520" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="72" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">running.</text>
    <text x="74" y="720" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="40" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">It is the only signal the system puts out,</text><text x="74" y="776" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="40" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">and it is a terrible one. It does not read</text><text x="74" y="832" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="40" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">as protection. It reads as a problem</text><text x="74" y="888" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="40" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0.2">with the water.</text>
    <text x="74" y="948" fill="#3A1518" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="50" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0.2">Real diligence, wrong thing.</text>
