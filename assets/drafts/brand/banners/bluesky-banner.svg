  <text x="1287" y="295" fill="#F8F3EA" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="900" letter-spacing="1.6" text-anchor="middle" transform="rotate(1.4 1287 253.5)">A WEEK</text>
