<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <filter id="fn4-feature-paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer>
    </filter>
    <filter id="fn4-feature-photo" x="-5%" y="-5%" width="110%" height="110%">
      <feColorMatrix type="saturate" values="0.9"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.03" intercept="0.01"/>
        <feFuncG type="linear" slope="1.02" intercept="0.01"/>
        <feFuncB type="linear" slope="0.99" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <pattern id="fn4-feature-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.55" fill="#121416" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#F8F3EA"/>
  <rect x="0" y="640" width="1600" height="360" fill="#EEE6D8"/>
  <g transform="rotate(-0.8 500 495)">
    <rect x="108" y="100" width="784" height="824" fill="#3A1518"/>
    <rect x="116" y="86" width="768" height="818" fill="#F8F3EA"/>
    <image href="/assets/source/editorial/hallway-duffel-set-down.png" x="120" y="90" width="760" height="810" preserveAspectRatio="xMidYMid slice" filter="url(#fn4-feature-photo)"/>
  </g>
  <g transform="rotate(1.4 1210 490)">
    <rect x="928" y="190" width="564" height="634" fill="#60735A"/>
    <rect x="936" y="176" width="548" height="628" fill="#F8F3EA"/>
    <image href="/assets/source/editorial/porch-two-chairs.png" x="940" y="180" width="540" height="620" preserveAspectRatio="xMidYMid slice" filter="url(#fn4-feature-photo)"/>
  </g>
  <g transform="rotate(-4 340 89)">
    <rect x="230" y="66" width="220" height="46" fill="#D9CBAF" opacity="0.74"/>
    <line x1="238" y1="73" x2="440" y2="70" stroke="#fff" stroke-opacity="0.38"/>
  </g>
  <g transform="rotate(4 1135 179)">
    <rect x="1040" y="156" width="190" height="46" fill="#D9CBAF" opacity="0.74"/>
    <line x1="1048" y1="163" x2="1220" y2="160" stroke="#fff" stroke-opacity="0.38"/>
  </g>
  <rect x="950" y="860" width="480" height="22" fill="#121416" transform="rotate(-0.8 1190 871)"/>
  <rect x="950" y="908" width="300" height="18" fill="#3A1518" transform="rotate(-0.8 1100 917)"/>
  <rect width="1600" height="1000" filter="url(#fn4-feature-paper)" opacity="0.22" pointer-events="none"/>
</svg>