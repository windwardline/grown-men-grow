<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <filter id="social-start-paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer>
    </filter>
    <filter id="social-start-photo" x="-5%" y="-5%" width="110%" height="110%">
      <feColorMatrix type="saturate" values="0.9"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.03" intercept="0.01"/>
        <feFuncG type="linear" slope="1.02" intercept="0.01"/>
        <feFuncB type="linear" slope="0.99" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <pattern id="social-start-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.55" fill="#121416" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#F8F3EA"/>
  <text x="550" y="68" fill="#121416" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="900" letter-spacing="3.8">GROWN MEN GROW</text>
  <g transform="rotate(-1 264 315)">
    <rect x="16" y="34" width="496" height="596" fill="#3A1518"/>
    <rect x="24" y="20" width="480" height="590" fill="#F8F3EA"/>
    <image href="/assets/source/editorial/sunlit-writing-table.png" x="28" y="24" width="472" height="582" preserveAspectRatio="xMidYMid slice" filter="url(#social-start-photo)"/>
  </g>
    <g transform="rotate(3 236 31)">
    <rect x="146" y="8" width="180" height="46" fill="#D9CBAF" opacity="0.74"/>
    <line x1="154" y1="15" x2="316" y2="12" stroke="#fff" stroke-opacity="0.38"/>
  </g>
    <text x="550" y="132" fill="#3A1518" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="3">START HERE</text>
    <text x="550" y="222" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="55" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="-1.6">Most of us learned</text><text x="550" y="280" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="55" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="-1.6">how to look like men</text>
    <g transform="rotate(0.7 852 388)">
    <rect x="538" y="342" width="628" height="92" fill="#3A1518"/>
    <text x="562" y="411.92" fill="#F8F3EA" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-2.5">BEFORE WE LEARNED</text>
  </g>
    <text x="550" y="492" fill="#121416" font-family="Bodoni 72, Didot, Georgia, Times New Roman, serif" font-size="50" font-style="italic">how to live as one.</text>
  <text x="550" y="568" fill="#71706B" font-family="Arial Narrow, Helvetica Neue Condensed, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="2.4">GROWNMENGROW.COM</text>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#121416" stroke-opacity="0.2"/>
  <rect width="1200" height="630" filter="url(#social-start-paper)" opacity="0.22" pointer-events="none"/>
</svg>