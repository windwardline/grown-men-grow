name: Security analysis

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Daily dependency and managed-edge truth. Semgrep and secret scanning
    # stay on the full Monday sweep below.
    - cron: "17 13 * * *"
    # Weekly full security sweep.
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    if: github.event_name != 'schedule' || github.event.schedule == '17 9 * * 1'
    name: Semgrep CE
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan repository content and scripts
        run: semgrep scan --config auto --error

  secret-scan:
    if: github.event_name != 'schedule' || github.event.schedule == '17 9 * * 1'
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # This repository is public, so a Dependabot-scoped GITHUB_TOKEN can list
      # a pull request's commits. The App-token mint that stood here existed for
      # the private-repo 403 (grown-men-grow#101) and its premise left with the
      # register on 2026-08-18.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A step, not a job: the gate rides an already-required check, so no
      # ruleset change. Pinned by SHA like every other action — the gate that
      # enforces pinning is itself pinned; Dependabot carries version bumps.
      - uses: windwardline/windwardline/actions/verify-action-pins@7e6d53cdf02944bf21cab73e13104386e9a4735a # v1.1.1

  dependency-scan:
    name: Dependency scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      # --config is explicit because the scanner would otherwise look for
      # osv-scanner.toml beside the lockfile, in theme/ -- and every tracked
      # file under theme/ ships inside the published Ghost theme zip. The
      # accepted risks and their expiry dates are recorded in that file.
      scan-args: |-
        --config=osv-scanner.toml
        --lockfile=theme/pnpm-lock.yaml
      fail-on-vuln: true
      upload-sarif: false
    permissions:
      actions: read
      contents: read
      security-events: write

  ghost-managed-edge:
    name: Ghost managed edge
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify the managed Ghost production edge
        uses: windwardline/windwardline/actions/verify-ghost-managed-edge@7e6d53cdf02944bf21cab73e13104386e9a4735a # v1.1.1
