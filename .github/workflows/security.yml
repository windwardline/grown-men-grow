name: Security analysis

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Daily dependency and managed-edge truth. Semgrep and secret scanning
    # stay on the full Monday sweep below.
    - cron: "17 13 * * *"
    # Weekly full security sweep.
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    if: github.event_name != 'schedule' || github.event.schedule == '17 9 * * 1'
    name: Semgrep CE
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan repository content and scripts
        run: semgrep scan --config auto --error

  secret-scan:
    if: github.event_name != 'schedule' || github.event.schedule == '17 9 * * 1'
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Set only on a Dependabot-triggered run, where it resolves from the
    # Dependabot secret store; on every other trigger it is the empty string and
    # the mint below is skipped. Not a feature flag — the fallback is the
    # unchanged behaviour this job has always had.
    env:
      APP_ID: ${{ secrets.FLEET_AUTOMERGE_APP_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks reads the PR's commit list through the API. On a PRIVATE repo a
      # Dependabot-scoped GITHUB_TOKEN cannot: `GET /pulls/{n}/commits` answers
      # 403 "Resource not accessible by integration", the action exits non-zero,
      # and a REQUIRED check fails on every Dependabot PR — grown-men-grow#101
      # sat unmergeable for a day on exactly this. Skipping the job for
      # Dependabot is not the fix: GitHub counts a skipped required check as
      # satisfied, so the gate would report green having scanned nothing, which
      # fleet-conformance.sh fails on by name.
      #
      # Public repos never hit this — a read-only token can list commits there —
      # so this matters for private-by-design repos only.
      #
      # A mangled PEM fails inside the mint as "Invalid keyData", naming neither
      # cause nor fix; dependabot-auto-merge.yml carries the diagnosis and the
      # one-line repair.
      - name: Mint the fleet token for the commit-list read
        id: apptoken
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.FLEET_AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.FLEET_AUTOMERGE_PRIVATE_KEY }}

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ steps.apptoken.outputs.token || secrets.GITHUB_TOKEN }}

      # A step, not a job: the gate rides an already-required check, so no
      # ruleset change. Pinned by SHA like every other action — the gate that
      # enforces pinning is itself pinned; Dependabot carries version bumps.
      - uses: windwardline/windwardline/actions/verify-action-pins@6c8d5dac0940af3adb5ace7e625a9cc62020d305 # v1.1.0

  dependency-scan:
    name: Dependency scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      # --config is explicit because the scanner would otherwise look for
      # osv-scanner.toml beside the lockfile, in theme/ -- and every tracked
      # file under theme/ ships inside the published Ghost theme zip. The
      # accepted risks and their expiry dates are recorded in that file.
      scan-args: |-
        --config=osv-scanner.toml
        --lockfile=theme/pnpm-lock.yaml
      fail-on-vuln: true
      upload-sarif: false
    permissions:
      actions: read
      contents: read
      security-events: write

  ghost-managed-edge:
    name: Ghost managed edge
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: windwardline/windwardline/actions/verify-ghost-managed-edge@6c8d5dac0940af3adb5ace7e625a9cc62020d305 # v1.1.0
