name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # TODO: this repo's real gates. Static-site default below; app repos
      # replace with npm ci → typecheck → lint → test → build.
      - name: Validate HTML
        run: npx --yes html-validate@9 index.html
      - name: Validate vercel.json parses
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
