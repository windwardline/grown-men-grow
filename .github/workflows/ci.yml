name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: theme/pnpm-lock.yaml
      - name: Install Ghost theme validation dependencies
        run: pnpm --dir theme install --frozen-lockfile
      - name: Validate Ghost theme
        run: pnpm --dir theme test
      - name: Package and validate Ghost theme archive
        run: |
          pnpm --dir theme zip
          theme/node_modules/.bin/gscan -z --fatal --verbose dist/grown-men-grow.zip
      - name: Verify repository contracts and assets
        run: node scripts/verify-repository.mjs
      - name: Install XML validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libxml2-utils
      - name: Validate SVG XML
        run: bash scripts/verify-svg-xml.sh
