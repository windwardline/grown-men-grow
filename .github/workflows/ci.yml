name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: theme/pnpm-lock.yaml
      - name: Install Ghost theme validation dependencies
        run: pnpm --dir theme install --frozen-lockfile
      - name: Install XML validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libxml2-utils

      # Runs exactly the gates AGENTS.md declares in its fleet-gates block, so the
      # contract's gate list is executable rather than prose. Byte-identical in
      # every fleet repository with CI; the conformance checker compares it.
      - name: Run declared gates
        run: |
          gates=$(awk '/^```fleet-gates$/{o=1;next} o&&/^```$/{o=0;next} o&&/^gate: /{sub(/^gate: /,"");print}' AGENTS.md)
          [ -n "$gates" ] || { echo "AGENTS.md declares no gate: entry in its fleet-gates block" >&2; exit 1; }
          n=0
          while IFS= read -r gate; do
            [ -n "$gate" ] || continue
            echo "::group::$gate"
            sh -c "$gate"
            echo "::endgroup::"
            n=$((n + 1))
          done <<< "$gates"
          echo "$n declared gate(s) executed."
